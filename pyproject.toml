[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinwatch"
version = "0.1.0"
description = "Ring + Alexa+ caretaking copilot — the remote family member who never sleeps at the door."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kinwatch" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
aws = ["boto3>=1.35", "strands-agents>=1.0"]

[project.scripts]
kinwatch = "kinwatch.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinwatch = ["static/*", "widgets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
